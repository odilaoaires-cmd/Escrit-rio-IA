<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Trading Desk - Escritório Virtual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #12151e;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #1b202e;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2b3245;
      z-index: 10;
    }
    header h1 { font-size: 15px; font-weight: 700; color: #4ade80; letter-spacing: 0.5px; }
    header span { font-size: 11px; background: #262d40; padding: 4px 8px; border-radius: 12px; color: #94a3b8; }

    #canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e2436 0%, #0f121a 100%);
      overflow: hidden;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      touch-action: manipulation;
    }

    #log-bar {
      background: #161a26;
      padding: 8px 12px;
      font-size: 12px;
      color: #cbd5e1;
      border-top: 1px solid #2b3245;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #log-bar b { color: #38bdf8; }

    #controls {
      background: #1b202e;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      border-top: 2px solid #2b3245;
      z-index: 10;
    }
    button {
      background: #272e42;
      color: #f8fafc;
      border: 1px solid #3b4563;
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    button:active { transform: scale(0.96); background: #3b82f6; }
    button.full { grid-column: span 2; background: #166534; border-color: #22c55e; }
    button.full:active { background: #15803d; }
  </style>
</head>
<body>

  <header>
    <h1>🏢 AI TRADING DESK</h1>
    <span id="status-badge">● ONLINE (5 AGENTES)</span>
  </header>

  <div id="canvas-container">
    <canvas id="officeCanvas" width="760" height="520"></canvas>
  </div>

  <div id="log-bar"><b>[Sistema]:</b> Escritório inicializado. Toque nos botões abaixo para simular tarefas.</div>

  <div id="controls">
    <button onclick="simularEvento('reuniao')">📢 Reunião com CEO</button>
    <button onclick="simularEvento('ideia')">🔍 Alpha Scout: Nova Ideia</button>
    <button onclick="simularEvento('backtest')">📊 Quant: Rodar Backtest</button>
    <button onclick="simularEvento('incubar')">🧪 Enviar p/ Incubação</button>
    <button class="full" onclick="simularEvento('operar')">🚀 Risco OK + Executar Ordem Real</button>
  </div>

  <script>
    const canvas = document.getElementById('officeCanvas');
    const ctx = canvas.getContext('2d');
    const logBar = document.getElementById('log-bar');

    // Configuração das mesas (posições na grade isométrica)
    const estacoes = {
      ceo:       { gx: 4.5, gy: 1.8, nome: 'Sala CEO', cor: '#f59e0b' },
      scout:     { gx: 1.5, gy: 2.2, nome: 'Pesquisa', cor: '#38bdf8' },
      quant:     { gx: 1.5, gy: 5.5, nome: 'Lab Quant', cor: '#a855f7' },
      incubator: { gx: 7.2, gy: 2.2, nome: 'Incubadora', cor: '#ec4899' },
      trader:    { gx: 7.2, gy: 5.5, nome: 'Execução', cor: '#22c55e' }
    };

    // Agentes de IA
    const agentes = [
      { id: 'ceo',       nome: 'Desk Chief',  corRoupa: '#f59e0b', corPele: '#f1c27d', gx: 4.5, gy: 2.3, tx: 4.5, ty: 2.3, fala: 'Monitorando desk...', emoji: '👔', timer: 0 },
      { id: 'scout',     nome: 'Alpha Scout', corRoupa: '#0284c7', corPele: '#e0ac69', gx: 1.5, gy: 2.7, tx: 1.5, ty: 2.7, fala: 'Buscando indicadores...', emoji: '🔍', timer: 0 },
      { id: 'quant',     nome: 'Quant Bot',   corRoupa: '#7e22ce', corPele: '#ffdbac', gx: 1.5, gy: 6.0, tx: 1.5, ty: 6.0, fala: 'Aguardando código...', emoji: '📊', timer: 0 },
      { id: 'incubator', nome: 'Incubator',   corRoupa: '#be185d', corPele: '#c68642', gx: 7.2, gy: 2.7, tx: 7.2, ty: 2.7, fala: '3 robôs em teste...', emoji: '⏳', timer: 0 },
      { id: 'trader',    nome: 'Risk/Trader', corRoupa: '#15803d', corPele: '#8d5524', gx: 7.2, gy: 6.0, tx: 7.2, ty: 6.0, fala: 'Risco max 2%', emoji: '🛡️', timer: 0 }
    ];

    // Converte grade (gx, gy) para coordenadas isométricas na tela
    function toIso(gx, gy) {
      const originX = canvas.width / 2;
      const originY = 120;
      const tileW = 72;
      const tileH = 36;
      return {
        x: originX + (gx - gy) * (tileW / 2),
        y: originY + (gx + gy) * (tileH / 2)
      };
    }

    function log(autor, texto) {
      logBar.innerHTML = `<b>[${autor}]:</b> ${texto}`;
    }

    function comandoAgente(id, tx, ty, fala, emoji, duracao = 240) {
      const ag = agentes.find(a => a.id === id);
      if (!ag) return;
      ag.tx = tx;
      ag.ty = ty;
      ag.fala = fala;
      ag.emoji = emoji;
      ag.timer = duracao;
      log(ag.nome, fala);
    }

    // Simulação dos fluxos de trading
    function simularEvento(tipo) {
      if (tipo === 'reuniao') {
        comandoAgente('ceo', 4.5, 3.5, 'Reunião rápida! Alinhando metas.', '📢', 260);
        comandoAgente('scout', 3.6, 3.6, 'Indo, chefe!', '🏃', 260);
        comandoAgente('quant', 3.8, 4.4, 'Levando relatórios.', '📑', 260);
        comandoAgente('incubator', 5.3, 3.6, 'Na escuta!', '🫡', 260);
        comandoAgente('trader', 5.2, 4.4, 'Risco controlado.', '🛡️', 260);
      } else if (tipo === 'ideia') {
        comandoAgente('scout', 1.8, 5.2, 'Achei setup RSI + Volume! Levando ao Quant.', '💡', 300);
        setTimeout(() => {
          comandoAgente('quant', 1.5, 6.0, 'Recebido! Codificando Pine Script...', '💻', 260);
          comandoAgente('scout', 1.5, 2.7, 'Voltando à pesquisa.', '🔍', 200);
        }, 2800);
      } else if (tipo === 'backtest') {
        comandoAgente('quant', 1.5, 6.0, 'Backtest: Winrate 64% | Profit Factor 1.85!', '📈', 300);
      } else if (tipo === 'incubar') {
        comandoAgente('quant', 6.5, 2.7, 'Enviando estratégia aprovada p/ Incubação!', '📦', 300);
        setTimeout(() => {
          comandoAgente('incubator', 7.2, 2.7, 'Congelada! Testando 30 dias ao vivo.', '🧪', 280);
          comandoAgente('quant', 1.5, 6.0, 'Pronto para próximo teste.', '✅', 200);
        }, 2800);
      } else if (tipo === 'operar') {
        comandoAgente('incubator', 6.8, 5.4, 'Incubação 100% aprovada!', '🏆', 260);
        setTimeout(() => {
          comandoAgente('trader', 7.2, 6.0, 'Risco 1.5% OK! Webhook enviado p/ corretora!', '🚀', 320);
          comandoAgente('ceo', 4.5, 2.3, 'Excelente execução, equipe!', '💰', 280);
          comandoAgente('incubator', 7.2, 2.7, 'Monitorando próximos.', '⏳', 200);
        }, 2500);
      }
    }

    // Desenha um bloco isométrico (chão ou mesa)
    function drawIsoTile(gx, gy, w, d, h, colorTop, colorLeft, colorRight) {
      const p1 = toIso(gx, gy);
      const p2 = toIso(gx + w, gy);
      const p3 = toIso(gx + w, gy + d);
      const p4 = toIso(gx, gy + d);

      // Lado esquerdo
      ctx.fillStyle = colorLeft;
      ctx.beginPath();
      ctx.moveTo(p4.x, p4.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p3.x, p3.y + h);
      ctx.lineTo(p4.x, p4.y + h);
      ctx.closePath();
      ctx.fill();

      // Lado direito
      ctx.fillStyle = colorRight;
      ctx.beginPath();
      ctx.moveTo(p3.x, p3.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p2.x, p2.y + h);
      ctx.lineTo(p3.x, p3.y + h);
      ctx.closePath();
      ctx.fill();

      // Topo
      ctx.fillStyle = colorTop;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.lineTo(p4.x, p4.y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.stroke();
    }

    // Desenha o piso do escritório (9x8)
    function drawFloor() {
      for (let x = 0; x < 9; x++) {
        for (let y = 0; y < 8; y++) {
          const isAlt = (x + y) % 2 === 0;
          drawIsoTile(
            x, y, 1, 1, 8,
            isAlt ? '#23293d' : '#1e2436',
            '#151926',
            '#11141f'
          );
        }
      }
    }

    // Desenha mesas e monitores
    function drawFurniture() {
      Object.values(estacoes).forEach(est => {
        drawIsoTile(est.gx - 0.4, est.gy - 0.3, 1.3, 0.8, 14, '#334155', '#1e293b', '#0f172a');
        // Monitor brilhante
        const pos = toIso(est.gx + 0.2, est.gy);
        ctx.fillStyle = est.cor;
        ctx.fillRect(pos.x - 10, pos.y - 16, 20, 12);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(pos.x - 8, pos.y - 14, 16, 8);
        // Linha de gráfico no monitor
        ctx.strokeStyle = '#4ade80';
        ctx.beginPath();
        ctx.moveTo(pos.x - 6, pos.y - 8);
        ctx.lineTo(pos.x - 2, pos.y - 12);
        ctx.lineTo(pos.x + 2, pos.y - 9);
        ctx.lineTo(pos.x + 6, pos.y - 13);
        ctx.stroke();

        // Etiqueta da estação
        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(est.nome, pos.x, pos.y + 24);
      });
    }

    // Desenha os avatares estilo Habbo
    function drawAgents(bounce) {
      // Ordena por profundidade (gy + gx) para sobreposição correta
      const sorted = [...agentes].sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

      sorted.forEach(ag => {
        // Movimentação suave até o alvo
        const dx = ag.tx - ag.gx;
        const dy = ag.ty - ag.gy;
        const dist = Math.hypot(dx, dy);
        let andando = false;
        if (dist > 0.04) {
          ag.gx += (dx / dist) * 0.035;
          ag.gy += (dy / dist) * 0.035;
          andando = true;
        }

        if (ag.timer > 0) ag.timer--;

        const pos = toIso(ag.gx, ag.gy);
        const step = andando ? Math.sin(bounce * 0.25) * 3 : 0;

        // Sombra no chão
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(pos.x, pos.y + 4, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pernas
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(pos.x - 6, pos.y - 12 + step, 5, 13);
        ctx.fillRect(pos.x + 1, pos.y - 12 - step, 5, 13);

        // Tronco (camisa colorida)
        ctx.fillStyle = ag.corRoupa;
        ctx.beginPath();
        ctx.roundRect(pos.x - 9, pos.y - 28, 18, 17, 4);
        ctx.fill();

        // Cabeça estilo pixel/Habbo
        ctx.fillStyle = ag.corPele;
        ctx.beginPath();
        ctx.roundRect(pos.x - 8, pos.y - 43, 16, 15, 5);
        ctx.fill();

        // Olhos
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(pos.x - 4, pos.y - 37, 2, 3);
        ctx.fillRect(pos.x + 2, pos.y - 37, 2, 3);

        // Nome abaixo do avatar
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ag.nome, pos.x, pos.y + 16);

        // Emoji flutuante acima da cabeça
        const floatY = Math.sin(bounce * 0.08) * 3;
        ctx.font = '16px sans-serif';
        ctx.fillText(ag.emoji, pos.x, pos.y - 50 + floatY);

        // Balão de fala quando ativo
        if (ag.timer > 0) {
          ctx.font = '11px sans-serif';
          const textW = ctx.measureText(ag.fala).width + 14;
          const bx = pos.x - textW / 2;
          const by = pos.y - 84 + floatY;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.roundRect(bx, by, textW, 20, 6);
          ctx.fill();

          ctx.fillStyle = '#0f172a';
          ctx.fillText(ag.fala, pos.x, by + 14);
        }
      });
    }

    // Permite controlar o escritório via parâmetros de URL (para integração futura com n8n/Grok)
    // Ex: ?agente=quant&fala=Lucro+de+5%&emoji=🚀
    function lerComandoURL() {
      const params = new URLSearchParams(window.location.search);
      const ag = params.get('agente');
      const fala = params.get('fala');
      const emoji = params.get('emoji') || '⚡';
      if (ag && estacoes[ag]) {
        comandoAgente(ag, estacoes[ag].gx, estacoes[ag].gy + 0.5, fala || 'Tarefa recebida!', emoji, 400);
      }
    }

    let frame = 0;
    function loop() {
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawFloor();
      drawFurniture();
      drawAgents(frame);
      requestAnimationFrame(loop);
    }

    lerComandoURL();
    loop();
  </script>
</body>
</html>
